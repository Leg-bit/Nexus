name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack NexusMedia.zip (if present)
        run: |
          if [ -f NexusMedia.zip ]; then
            unzip -o NexusMedia.zip -d _tmp
            cp -r _tmp/NexusMedia/. .
            rm -rf _tmp NexusMedia.zip
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Update NEXUS Media project" || true
            git push || true
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unit tests
        continue-on-error: true
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NexusMedia-debug-apk
          path: app/build/outputs/apk/debug/*.apk
